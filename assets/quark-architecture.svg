<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff;">
  <title>Where Quark fits in your monorepo</title>
  <desc>Diagram showing a real monorepo example and where Quark tooling operates at each stage</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <linearGradient id="quarkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Where does Quark fit in your monorepo?</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#888">Example: a design system with 3 component packages</text>

  <text x="28" y="82" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">① SCAFFOLD</text>

  <rect x="24" y="90" width="230" height="46" rx="6" fill="#1e1e2e" stroke="#3b3b5c" stroke-width="1"/>
  <text x="34" y="107" font-size="10" fill="#a3e635" font-family="'SF Mono', 'Fira Code', monospace">$</text>
  <text x="46" y="107" font-size="10" fill="#e2e8f0" font-family="'SF Mono', 'Fira Code', monospace">quark new my-design-system</text>
  <text x="34" y="123" font-size="10" fill="#94a3b8" font-family="'SF Mono', 'Fira Code', monospace">✔ Workspace ready</text>

  <line x1="140" y1="136" x2="140" y2="158" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="24" y="160" width="750" height="195" rx="8" fill="url(#quarkGrad)" stroke="#c7d2fe" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="40" y="180" font-size="12" font-weight="700" fill="#333">my-design-system/</text>
  <text x="720" y="180" font-size="10" fill="#6366f1" font-weight="600" text-anchor="end">generated by quark</text>

  <rect x="44" y="192" width="155" height="72" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="54" y="210" font-size="11" font-weight="600" fill="#1e40af">packages/</text>
  <text x="60" y="226" font-size="10" fill="#555">├─ button/</text>
  <text x="60" y="240" font-size="10" fill="#555">├─ modal/</text>
  <text x="60" y="254" font-size="10" fill="#555">└─ form-input/</text>

  <rect x="214" y="192" width="155" height="72" rx="6" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text x="224" y="210" font-size="11" font-weight="600" fill="#92400e">apps/</text>
  <text x="230" y="226" font-size="10" fill="#555">├─ storybook/</text>
  <text x="230" y="240" font-size="10" fill="#555">└─ docs/</text>

  <rect x="384" y="192" width="175" height="72" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="394" y="210" font-size="11" font-weight="600" fill="#555">Config</text>
  <text x="400" y="226" font-size="10" fill="#555">├─ pnpm-workspace.yaml</text>
  <text x="400" y="240" font-size="10" fill="#555">├─ nx.json</text>
  <text x="400" y="254" font-size="10" fill="#555">└─ quark-config.json</text>

  <rect x="574" y="192" width="185" height="72" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="584" y="210" font-size="11" font-weight="600" fill="#166534">Templates</text>
  <text x="590" y="226" font-size="10" fill="#555">├─ .github/workflows/</text>
  <text x="590" y="240" font-size="10" fill="#555">├─ .env.example</text>
  <text x="590" y="254" font-size="10" fill="#555">└─ .npmrc template</text>

  <rect x="44" y="274" width="715" height="30" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="54" y="294" font-size="10" fill="#5b21b6" font-weight="600">Nx handles:</text>
  <text x="130" y="294" font-size="10" fill="#5b21b6">build · test · lint · cache · task deps</text>
  <text x="420" y="294" font-size="10" fill="#5b21b6" font-weight="600">Quark adds:</text>
  <text x="496" y="294" font-size="10" fill="#5b21b6">release · publish · freeze · scaffold · Yalc</text>

  <text x="122" y="330" font-size="10" fill="#999">button depends on form-input</text>
  <rect x="50" y="335" width="200" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="350" font-size="9" fill="#666" font-family="'SF Mono', 'Fira Code', monospace">"form-input": "workspace:*"</text>

  <text x="28" y="388" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">② DEVELOP</text>

  <rect x="24" y="396" width="175" height="42" rx="6" fill="#1e1e2e" stroke="#3b3b5c" stroke-width="1"/>
  <text x="34" y="413" font-size="10" fill="#a3e635" font-family="'SF Mono', 'Fira Code', monospace">$</text>
  <text x="46" y="413" font-size="10" fill="#e2e8f0" font-family="'SF Mono', 'Fira Code', monospace">pnpm run build:all</text>
  <text x="34" y="427" font-size="9" fill="#64748b" font-family="'SF Mono', 'Fira Code', monospace">Nx builds in dependency order</text>

  <rect x="214" y="396" width="175" height="42" rx="6" fill="#1e1e2e" stroke="#3b3b5c" stroke-width="1"/>
  <text x="224" y="413" font-size="10" fill="#a3e635" font-family="'SF Mono', 'Fira Code', monospace">$</text>
  <text x="236" y="413" font-size="10" fill="#e2e8f0" font-family="'SF Mono', 'Fira Code', monospace">quark publish button</text>
  <text x="224" y="427" font-size="9" fill="#64748b" font-family="'SF Mono', 'Fira Code', monospace">Yalc → test in other apps</text>

  <rect x="404" y="396" width="175" height="42" rx="6" fill="#1e1e2e" stroke="#3b3b5c" stroke-width="1"/>
  <text x="414" y="413" font-size="10" fill="#a3e635" font-family="'SF Mono', 'Fira Code', monospace">$</text>
  <text x="426" y="413" font-size="10" fill="#e2e8f0" font-family="'SF Mono', 'Fira Code', monospace">pnpm run storybook</text>
  <text x="414" y="427" font-size="9" fill="#64748b" font-family="'SF Mono', 'Fira Code', monospace">Visual testing</text>

  <rect x="594" y="396" width="175" height="42" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
  <text x="604" y="413" font-size="10" fill="#166534" font-weight="600">Atlas</text>
  <text x="604" y="427" font-size="9" fill="#166534">Visualize package dependencies</text>

  <text x="28" y="468" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">③ RELEASE</text>

  <rect x="24" y="476" width="145" height="56" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="96" y="496" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">pnpm run release</text>
  <text x="96" y="512" text-anchor="middle" font-size="9" fill="#92400e">Pick bump per package</text>
  <text x="96" y="524" text-anchor="middle" font-size="9" fill="#92400e">Freeze / cascade majors</text>

  <line x1="169" y1="504" x2="192" y2="504" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="194" y="484" width="120" height="40" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="254" y="502" text-anchor="middle" font-size="10" fill="#555" font-family="'SF Mono', 'Fira Code', monospace">.release/</text>
  <text x="254" y="516" text-anchor="middle" font-size="10" fill="#555" font-family="'SF Mono', 'Fira Code', monospace">  map.json</text>

  <line x1="314" y1="504" x2="337" y2="504" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="339" y="484" width="115" height="40" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="396" y="502" text-anchor="middle" font-size="10" fill="#555">git commit</text>
  <text x="396" y="516" text-anchor="middle" font-size="10" fill="#555">Push → Open PR</text>

  <line x1="454" y1="504" x2="477" y2="504" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="479" y="484" width="115" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="536" y="502" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">PR merged</text>
  <text x="536" y="516" text-anchor="middle" font-size="10" fill="#1e40af">→ main</text>

  <line x1="594" y1="504" x2="617" y2="504" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="619" y="484" width="80" height="40" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="659" y="502" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6">git tag</text>
  <text x="659" y="516" text-anchor="middle" font-size="10" fill="#5b21b6" font-family="'SF Mono', 'Fira Code', monospace">v2.3.0</text>

  <text x="28" y="558" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="1">④ PUBLISH</text>

  <rect x="24" y="566" width="155" height="46" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="101" y="584" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">prod-publish</text>
  <text x="101" y="598" text-anchor="middle" font-size="9" fill="#991b1b">Diff tags → find changed</text>

  <line x1="179" y1="589" x2="202" y2="589" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="204" y="570" width="145" height="38" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="276" y="588" text-anchor="middle" font-size="9" fill="#555">Check version exists?</text>
  <text x="276" y="600" text-anchor="middle" font-size="9" fill="#555">Skip if already published</text>

  <line x1="349" y1="589" x2="372" y2="589" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="374" y="570" width="120" height="38" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2"/>
  <text x="434" y="588" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">npm registry</text>
  <text x="434" y="600" text-anchor="middle" font-size="10" fill="#166534">@scope/button</text>

  <rect x="24" y="622" width="745" height="36" rx="6" fill="#1e1e2e" stroke="#3b3b5c" stroke-width="1"/>
  <text x="34" y="639" font-size="10" fill="#e2e8f0" font-family="'SF Mono', 'Fira Code', monospace">button  2.2.0 → 3.0.0 (major)   modal  1.1.0 → 1.2.0 (minor)   form-input  1.4.0 → 1.4.0 (frozen)</text>
  <text x="34" y="652" font-size="10" fill="#94a3b8" font-family="'SF Mono', 'Fira Code', monospace">✔ Published 2 of 3 packages (1 frozen, skipped)</text>

  <rect x="24" y="668" width="85" height="20" rx="10" fill="#6366f1"/>
  <text x="66" y="682" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Quark</text>
  <text x="120" y="682" font-size="10" fill="#888">= steps ①③④ + Yalc + Atlas.  Nx handles builds, tests, and caching in step ②.</text>

</svg>
